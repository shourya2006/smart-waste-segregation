[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-waste-segregation"
version = "0.1.0"
description = "Handcrafted image features and classical ML for educational waste classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "Pillow>=10.4",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "joblib>=1.4",
    "ImageHash>=4.3",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]
demo = ["gradio==6.30.0"]

[project.scripts]
waste-data = "waste_sorting.data_cli:main"
waste-features = "waste_sorting.features:main"
waste-train = "waste_sorting.training:main"
waste-svm-study = "waste_sorting.svm_study:main"
waste-evaluate = "waste_sorting.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
