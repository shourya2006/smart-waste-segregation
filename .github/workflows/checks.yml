name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked demo environment and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-demo.lock
          python -m pip install --no-deps .
          python -m pip check
      - name: Lint Python sources
        run: ruff check .
      - name: Verify package import and experiment configuration
        run: |
          python -c "import waste_sorting; print(waste_sorting.__version__)"
          python -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('configs/phase1.toml').read_text())"
      - name: Test data integrity and split isolation
        run: python -m unittest discover -s tests -v
